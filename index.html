<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World</title>
    
    <style>
         body {
            font-family: 'Shadows Into Light', cursive, sans-serif;
            
            /* Tu imagen de fondo de GitHub / URL */
            background-image: url('https://raw.githubusercontent.com/Abelyha/hello-worlD/refs/heads/main/gif.gif');
            background-repeat: no-repeat;
            background-size: cover;
            
            /* Mover la imagen de fondo: Primer valor (izq/der), Segundo valor (arriba/abajo) */
            background-position: 50% 30%; 
            
            background-color: rgba(0, 0, 0, 0.6);
            background-blend-mode: darken;
            color: #fff9e6;
            
            /* Estilo Widget: Ocupa toda el área pero permite alinear el contenido */
            display: flex;
            flex-direction: column;
            align-items: center; /* Cambia a 'flex-start' si lo quieres a la izquierda o 'flex-end' a la derecha */
            justify-content: center; /* Cambia a 'flex-start' para moverlo arriba */
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
         }
    </style>
</head>
<body>
    <p>Hello wolrD / ego sum me</p>
    
    <audio id="music" loop>
        <source src="levels.mp3" type="audio/mpeg">
    </audio>
    <script>
        function onmusic(){
            const music = document.getElementById('music');
            music.volume = .5;
            music.play().then(() =>{
                document.removeEventListener('click', onmusic);
                }).catch(error => {
                    console.log("el navegador no deja ps", error);
                });
        }
        document.addEventListener('click', onmusic);
    </script>
</body>
</html>
